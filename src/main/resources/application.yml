server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:geoedu}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:init.sql

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:7b}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.geoedu.model.entity

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:7b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

app:
  vector:
    dimension: ${VECTOR_DIMENSION:768}
  search:
    top-k: ${SEARCH_TOP_K:3}
  chat:
    related-questions:
      max: ${CHAT_RELATED_QUESTIONS_MAX:5}
  upload:
    path: ${UPLOAD_PATH:/data/images}
    max-size: ${UPLOAD_MAX_SIZE:10MB}
    max-width: ${UPLOAD_MAX_WIDTH:1920}
    max-height: ${UPLOAD_MAX_HEIGHT:1080}
    quality: ${UPLOAD_QUALITY:0.85}
    thumbnail:
      enabled: ${UPLOAD_THUMBNAIL_ENABLED:true}
      width: ${UPLOAD_THUMBNAIL_WIDTH:200}
      height: ${UPLOAD_THUMBNAIL_HEIGHT:200}

jwt:
  secret: ${JWT_SECRET:your-secret-key-placeholder-change-in-production}
  expiration: ${JWT_EXPIRATION:604800000}

logging:
  level:
    root: INFO
    com.geoedu: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
